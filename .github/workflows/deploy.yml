name: Customer Churn MLOps Pipeline

on:
  push:
    branches: [ main ]

  schedule:
    - cron: '0 0 * * 0'

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Step 1 - Check Data Drift
      id: drift-check
      run: |
        python -c "from drift_monitor import check_data_drift; import os; result=check_data_drift(); open(os.environ['GITHUB_OUTPUT'], 'a').write(f'drift_detected={str(result).lower()}\n')"

    - name: Step 2 - Retrain Model
      if: steps.drift-check.outputs.drift_detected == 'true'
      run: |
        python retrain.py

    - name: Step 3 - Run API Tests
      run: |
        uvicorn app:app --host 127.0.0.1 --port 8000 &
        sleep 5
        curl -f http://127.0.0.1:8000/health

    - name: Step 4 - Verify Pipeline
      run: |
        echo "Customer Churn MLOps Pipeline completed successfully!"